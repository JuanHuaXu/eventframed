name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.7
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install adapter dependencies
        working-directory: plugin
        run: npm ci --ignore-scripts
      - name: Audit shipped adapter dependencies
        working-directory: plugin
        run: npm audit --omit=dev
      - name: Test and build RC artifacts
        run: make check build VERSION=0.1.0-rc.0
